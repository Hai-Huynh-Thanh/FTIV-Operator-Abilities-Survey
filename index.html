<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
    body { background:#f2f4f7; font-family:-apple-system,BlinkMacSystemFont,sans-serif; }
    .app-box { max-width: 600px; margin:auto; background:#fff; min-height:100vh; padding:20px; box-shadow:0 0 10px rgba(0,0,0,0.05); }
    .header { display:flex; align-items:center; gap:14px; padding-bottom:12px; border-bottom:2px solid #e0e0e0; }
    .logo { height:44px; width:auto; }
    .main-title { font-size:18px; font-weight:700; color:#003366; }
    .sub-title { font-size:13px; color:#555; }
    .autocomplete-list li { cursor:pointer; font-size:15px; }
    .autocomplete-list li:hover { background:#f1f5ff; }
    .section-title { font-size:15px; font-weight:700; color:#003366; margin:22px 0 10px; padding-left:10px; border-left:4px solid #0d6efd; display:flex; align-items:center; justify-content:space-between; }
    .section-title:first-child { margin-top:8px; }
    .optional-badge { font-size:11px; font-weight:normal; background:#e2e3e5; color:#383d41; padding:2px 8px; border-radius:12px; }
    .criteria-item { border:1px solid #e5e5e5; border-radius:10px; padding:12px; margin-bottom:10px; transition: border-color .15s; }
    .criteria-item.missing { border-color:#dc3545; background-color:#fff8f8; }
    .criteria-text { font-size:14px; margin-bottom:8px; }
    .rating-btns { display:flex; gap:10px; }
    .rating-btn { flex:1; padding:10px 0; border:1px solid #ccc; border-radius:8px; text-align:center; cursor:pointer; font-weight:600; background:#fafafa; user-select:none; font-size:14px; }
    .rating-btn.btn-pass.selected { background:#198754; color:#fff; border-color:#198754; }
    .rating-btn.btn-fail.selected { background:#dc3545; color:#fff; border-color:#dc3545; }
    .criteria-hint { font-style: italic; color: #0066cc; font-size: 13px; margin-top: 8px; display: none; }
    #criteriaWrap { display:none; }
  </style>
</head>

  <div class="mt-3">
    <label class="form-label fw-bold">Ngày đánh giá</label>
    <input type="date" class="form-control form-control-lg" id="evalDate">
  </div>

  <div class="mt-3 position-relative">
    <label class="form-label fw-bold">Tên nhân viên</label>
    <input type="text" class="form-control form-control-lg" id="employee" placeholder="🔍 Gõ để tìm nhân viên..." autocomplete="off">
    <ul id="employeeList" class="list-group position-absolute w-100 d-none autocomplete-list" style="z-index:1000; max-height:200px; overflow-y:auto;"></ul>
  </div>

  <div class="mt-3 position-relative">
    <label class="form-label fw-bold">Sản phẩm Bulk</label>
    <input type="text" class="form-control form-control-lg" id="bulk" placeholder="🔍 Gõ để tìm sản phẩm Bulk..." autocomplete="off">
    <ul id="bulkList" class="list-group position-absolute w-100 d-none autocomplete-list" style="z-index:1000; max-height:200px; overflow-y:auto;"></ul>
  </div>

  <div class="mt-3 position-relative">
    <label class="form-label fw-bold">Mixing Tank</label>
    <input type="text" class="form-control form-control-lg" id="tank" placeholder="🔍 Gõ để tìm tank..." autocomplete="off">
    <ul id="tankList" class="list-group position-absolute w-100 d-none autocomplete-list" style="z-index:1000; max-height:200px; overflow-y:auto;"></ul>
  </div>

  <div class="d-grid my-3">
    <button class="btn btn-primary btn-lg shadow-sm" id="btnLoadCriteria" onclick="loadCriteriaSection()">
      Bắt đầu đánh giá
    </button>
  </div>

  <div id="criteriaWrap">
    <hr>
    <div id="criteriaList"></div>
    <div class="d-grid my-3">
      <button class="btn btn-success btn-lg shadow-sm" id="btnSubmit" onclick="submitEvaluation()">
        💾 Lưu kết quả
      </button>
    </div>
  </div>

  <div id="loading" class="text-center my-3 d-none">
    <div class="spinner-border text-primary"></div>
    <div class="mt-2 text-muted">Đang xử lý dữ liệu...</div>
  </div>

<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyG447gVBArgX6iIb3tdkQ0vafODxPpAVYsGPUTBobPKc2Zxvghn0ofWuv2F4QI7mx2_A/exec";

  let criteriaData = [];
  let employeesData = [];
  let tanksData = [];
  let bulksData = [];
  let ratings = {}; // stt -> "Đạt" | "Không Đạt"

  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("evalDate").value = new Date().toISOString().slice(0, 10);
    showLoading();
    const script = document.createElement("script");
    script.src = `${WEB_APP_URL}?action=getFormData&callback=handleFormData`;
    script.onerror = () => {
      hideLoading();
      swal("Lỗi Hệ Thống", "Không thể kết nối đến máy chủ Google Sheets", "error");
    };
    document.body.appendChild(script);
  });

  function handleFormData(res) {
    hideLoading();
    if (res && res.status === "SUCCESS") {
      employeesData = res.data.employees || [];
      tanksData = res.data.tanks || [];
      bulksData = res.data.bulks || [];
    } else {
      swal("Lỗi dữ liệu", "Không thể tải dữ liệu form", "error");
    }
  }

  function setupAutocomplete(inputId, listId, getData) {
    const input = document.getElementById(inputId);
    const list = document.getElementById(listId);
    input.addEventListener("input", () => {
      const keyword = input.value.toUpperCase().trim();
      list.innerHTML = "";
      const data = getData();
      if (!keyword || data.length === 0) { list.classList.add("d-none"); return; }
      const matched = data.filter(f => f.toUpperCase().includes(keyword));
      if (matched.length === 0) { list.classList.add("d-none"); return; }
      matched.forEach(f => {
        const li = document.createElement("li");
        li.className = "list-group-item";
        li.textContent = f;
        li.onclick = () => { input.value = f; list.classList.add("d-none"); };
        list.appendChild(li);
      });
      list.classList.remove("d-none");
    });
  }
  setupAutocomplete("employee", "employeeList", () => employeesData);
  setupAutocomplete("bulk", "bulkList", () => bulksData);
  setupAutocomplete("tank", "tankList", () => tanksData);

  document.addEventListener("click", e => {
    if (!e.target.closest(".position-relative")) {
      document.getElementById("employeeList").classList.add("d-none");
      document.getElementById("bulkList").classList.add("d-none");
      document.getElementById("tankList").classList.add("d-none");
    }
  });

  function loadCriteriaSection() {
    const evalDate = document.getElementById("evalDate").value;
    const employee = document.getElementById("employee").value.trim();
    const bulk = document.getElementById("bulk").value.trim();
    const tank = document.getElementById("tank").value.trim();

    if (!evalDate || !employee || !bulk || !tank) {
      swal("Chú ý", "Vui lòng nhập đầy đủ Ngày, Nhân viên, Sản phẩm Bulk và Mixing Tank trước khi đánh giá", "warning");
      return;
    }

    showLoading();
    const script = document.createElement("script");
    script.src = `${WEB_APP_URL}?action=getCriteriaByBulk&bulkName=${encodeURIComponent(bulk)}&callback=handleCriteriaData`;
    script.onerror = () => {
      hideLoading();
      swal("Lỗi", "Không thể tải tiêu chí đánh giá cho sản phẩm Bulk này", "error");
    };
    document.body.appendChild(script);
  }

  function handleCriteriaData(res) {
    hideLoading();
    if (res && res.status === "SUCCESS") {
      criteriaData = res.data || [];
      
      if (criteriaData.length === 0) {
        swal("Thông báo", "Không có tiêu chí đánh giá nào được cấu hình cho sản phẩm Bulk này.", "info");
        document.getElementById("criteriaWrap").style.display = "none";
        return;
      }

      ratings = {};
      const wrap = document.getElementById("criteriaList");
      wrap.innerHTML = "";

      let lastCategory = null;
      criteriaData.forEach(c => {
        if (c.category !== lastCategory) {
          const h = document.createElement("div");
          h.className = "section-title";
          
          const isOptionalCategory = c.category.toLowerCase().includes("tìm hiểu thêm");
          if (isOptionalCategory) {
            h.innerHTML = `<span>${c.category}</span> <span class="optional-badge">Tùy chọn</span>`;
          } else {
            h.textContent = c.category;
          }
          
          wrap.appendChild(h);
          lastCategory = c.category;
        }

        const div = document.createElement("div");
        div.className = "criteria-item";
        div.id = "crit-" + c.stt;

        const text = document.createElement("div");
        text.className = "criteria-text";
        text.textContent = c.stt + ". " + c.text;
        div.appendChild(text);

        const btnRow = document.createElement("div");
        btnRow.className = "rating-btns";
        
        const hintDiv = document.createElement("div");
        hintDiv.className = "criteria-hint";
        if (c.hint) {
          hintDiv.textContent = "💡 Gợi ý: " + c.hint;
        }

        // Tạo 2 nút: Đạt và Không Đạt
        const options = [
          { label: "Đạt", value: "Đạt", class: "btn-pass" },
          { label: "Không Đạt", value: "Không Đạt", class: "btn-fail" }
        ];

        options.forEach(opt => {
          const btn = document.createElement("div");
          btn.className = `rating-btn ${opt.class}`;
          btn.textContent = opt.label;
          btn.onclick = () => selectRating(c.stt, opt.value, div, btnRow, hintDiv, c.hint, btn);
          btnRow.appendChild(btn);
        });

        div.appendChild(btnRow);
        if (c.hint) {
          div.appendChild(hintDiv);
        }
        wrap.appendChild(div);
      });

      document.getElementById("criteriaWrap").style.display = "block";
      document.getElementById("btnLoadCriteria").classList.add("d-none");
      document.getElementById("criteriaWrap").scrollIntoView({ behavior: "smooth" });

    } else {
      swal("Lỗi dữ liệu", "Không thể tải danh sách tiêu chí", "error");
    }
  }

  function selectRating(stt, value, itemDiv, btnRow, hintDiv, hintText, selectedBtn) {
    ratings[stt] = value;
    itemDiv.classList.remove("missing");
    
    Array.from(btnRow.children).forEach(btn => {
      btn.classList.remove("selected");
    });
    selectedBtn.classList.add("selected");

    if (hintText) {
      hintDiv.style.display = "block";
    }
  }

  function submitEvaluation() {
    // Chỉ kiểm tra bắt buộc đối với các câu hỏi không thuộc Category "Tìm hiểu thêm"
    const missing = criteriaData.filter(c => {
      const isOptional = c.category && c.category.toLowerCase().includes("tìm hiểu thêm");
      return !isOptional && !ratings[c.stt];
    });

    if (missing.length > 0) {
      missing.forEach(c => {
        const el = document.getElementById("crit-" + c.stt);
        if (el) el.classList.add("missing");
      });
      swal("Chú ý", `Còn ${missing.length} tiêu chí bắt buộc chưa được đánh giá`, "warning");
      document.getElementById("crit-" + missing[0].stt).scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }

    // Chuẩn bị dữ liệu gửi đi (bao gồm cả các câu hỏi không bắt buộc nếu được chọn hoặc để trống)
    const payload = {
      action: "submitEvaluation",
      evalDate: document.getElementById("evalDate").value,
      employee: document.getElementById("employee").value.trim(),
      bulk: document.getElementById("bulk").value.trim(),
      tank: document.getElementById("tank").value.trim(),
      ratings: criteriaData.map(c => ({
        stt: c.stt,
        text: c.text,
        category: c.category,
        rating: ratings[c.stt] || "" // Nếu thuộc "Tìm hiểu thêm" mà không chọn thì để trống
      }))
    };

    showLoading();
    fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
      .then(res => res.text())
      .then(text => {
        hideLoading();
        const res = JSON.parse(text);
        if (res.status === "SUCCESS") {
          swal("Đã lưu ✅", res.message, "success").then(() => location.reload());
        } else {
          swal("Lỗi ❌", res.message, "error");
        }
      })
      .catch(err => {
        hideLoading();
        swal("Lỗi mạng", "Mất liên lạc với máy chủ Google Sheets", "error");
      });
  }

  function showLoading() { document.getElementById("loading").classList.remove("d-none"); }
  function hideLoading() { document.getElementById("loading").classList.add("d-none"); }
</script>

</body>
</html>
